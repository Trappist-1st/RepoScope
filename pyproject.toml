[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reposcope"
version = "0.1.0"
description = "Autonomous codebase research agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "GitPython>=3.1.40",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "tree-sitter>=0.22",
    "tree-sitter-python>=0.21",
    "tree-sitter-javascript>=0.21",
    "tree-sitter-typescript>=0.21",
    "tree-sitter-java>=0.21",
    "psycopg[binary,pool]>=3.1",
    "numpy>=1.26",
    "PyYAML>=6.0",
    "rank-bm25>=0.2.2",
    "qdrant-client>=1.9",
    "langgraph>=0.2",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "mcp>=1.0",
    "redis>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]
watch = ["watchdog>=4.0"]
retrieval = [
    "sentence-transformers>=3.0",
    # torch>=2.13 hits WinError 1114 (c10.dll) on many Windows setups
    "torch==2.8.0; platform_system=='Windows'",
]
workflow = ["langgraph>=0.2"]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.27"]
mcp = ["mcp>=1.0"]
all = ["reposcope[dev,retrieval,workflow,api,mcp,watch]"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "eval*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
